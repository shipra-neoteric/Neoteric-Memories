# Render Blueprint — OPTIONAL. The rest of this app runs entirely on free tiers
# without this: the HTTP API is a Vercel serverless function
# (apps/api/api/index.js), and background jobs (photo processing, Drive sync, ZIP
# generation, retention) process via admin-/guest-triggered immediate processing +
# a free GitHub Actions recovery cron + a once-daily Vercel native Cron Job for
# retention — see docs/JOB_PROCESSING.md for exactly how, and docs/DEPLOYMENT.md's
# "Current architecture" section for the full picture including what to verify
# before deciding you don't need this at all.
#
# Still useful if you'd rather have a persistent worker (~2s job-processing latency,
# no bounded-per-run limits) instead of relying on the mechanisms above — deploys
# ONLY the background worker (job queue processor + Drive sync/retention
# schedulers, see apps/api/src/jobs/worker.ts). Running this alongside the
# mechanisms above is safe (the job queue's optimistic claiming means they never
# double-process the same job) — a reasonable way to have both while you verify the
# serverless-only path actually works for you.
#
# Import this repo at https://dashboard.render.com/blueprints and Render will read
# this file automatically, or create the service manually using the same
# commands/env vars below — see docs/DEPLOYMENT.md for the full walkthrough (most env
# vars need real values only you have — Atlas connection string, AWS credentials,
# etc — Render will prompt for anything marked sync:false).
#
# NOTE: this service's `type` changed from `web` to `worker` (it used to also serve
# HTTP, embedded in the same process — see git history before this comment if you
# need that). Render does not support changing a service's type in place via a
# Blueprint re-sync; if you're migrating an existing `neoteric-memories-api` web
# service, either delete it and let this Blueprint create a fresh worker service, or
# create the worker service manually and delete the old web service once it's
# confirmed working — see docs/DEPLOYMENT.md.
services:
  - type: worker
    name: neoteric-memories-worker
    runtime: node
    plan: starter
    region: singapore # pick whatever is closest to your guests; Atlas/S3 should be in the same region
    # --include=dev is required here: NODE_ENV=production (set below) makes plain
    # `npm install` skip devDependencies, but @types/node, typescript, and prisma's
    # CLI (all needed only to build, not to run) all live there.
    buildCommand: npm install --include=dev && npm run build -w @neoteric-memories/shared && npm run build -w @neoteric-memories/api
    startCommand: node apps/api/dist/jobs/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false # your Vercel frontend URL, e.g. https://neoteric-memories.vercel.app
      - key: API_BASE_URL
        sync: false # the Vercel backend's own URL, e.g. https://neoteric-memories-backend.vercel.app
      - key: DATABASE_URL
        sync: false # MongoDB Atlas connection string — see docs/DEPLOYMENT.md
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: FACE_PROVIDER
        value: mock # switch to "rekognition" once AWS is set up — see docs/AWS_DEPLOYMENT.md
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false # https://<the Vercel backend's URL>/api/admin/integrations/google/callback
